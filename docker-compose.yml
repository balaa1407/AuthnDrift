services:
  authdrift:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authdrift-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - AUTH_DRIFT_ENABLE_THREAT_INTEL=${AUTH_DRIFT_ENABLE_THREAT_INTEL:-true}
      - AUTH_DRIFT_IP_CACHE_TTL=${AUTH_DRIFT_IP_CACHE_TTL:-86400}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-authdrift}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - authdrift-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: authdrift-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/authdrift-realm.json:/opt/keycloak/data/import/authdrift-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - authdrift-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  authdrift-net:
    driver: bridge

volumes:
  keycloak-data:

